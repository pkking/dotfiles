name: Agent Issue Implementation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open issue number with agent:implement label
        type: number
        required: true

permissions: {}

concurrency:
  group: agent-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:implement'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Read and validate labeled issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/issue.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          issue = json.loads((Path(os.environ['RUNNER_TEMP']) / 'issue.json').read_text())
          assert not issue.get('pull_request') and issue['state'] == 'open', 'issue must be open and not a PR'
          assert 'agent:implement' in {l['name'] for l in issue['labels']}, 'missing maintainer label'
          body = (issue.get('body') or '')[:16000]
          Path('.agent-request.md').write_text(f"# Issue #{issue['number']}: {issue['title']}\n\n{body}\n", encoding='utf-8')
          PY
      - name: Implement with workspace-only Codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          sandbox: workspace-write
          safety-strategy: drop-sudo
          prompt-file: .github/agent-issue-prompt.md
      - name: Validate and export bounded patch
        run: |
          set -euo pipefail
          rm -f .agent-request.md
          rm -rf .agent-local-evidence
          git show HEAD:scripts/agent_patch_policy.py > "$RUNNER_TEMP/trusted-policy.py"
          python3 -B "$RUNNER_TEMP/trusted-policy.py" --output "$RUNNER_TEMP/agent.patch"
          python3 -B scripts/ci_quality.py --output "$RUNNER_TEMP/local-proof"
          mkdir -p "$RUNNER_TEMP/agent-bundle"
          cp "$RUNNER_TEMP/agent.patch" "$RUNNER_TEMP/agent-bundle/agent.patch"
          cp -a "$RUNNER_TEMP/local-proof" "$RUNNER_TEMP/agent-bundle/local-proof"
      - name: Attach verified patch and offline evidence
        uses: actions/upload-artifact@v4
        with:
          name: agent-candidate-${{ github.event.issue.number || inputs.issue_number }}
          path: ${{ runner.temp }}/agent-bundle/
          if-no-files-found: error
          retention-days: 7

  verify:
    # This runner executes agent-generated scripts/tests. It has no publication
    # credentials, no repository write permission, and no access to App secrets.
    needs: [generate]
    if: needs.generate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    outputs:
      patch_sha256: ${{ steps.seal.outputs.patch_sha256 }}
      base_sha: ${{ steps.seal.outputs.base_sha }}
    steps:
      - name: Checkout trusted repository base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Download candidate as untrusted input
        uses: actions/download-artifact@v4
        with:
          name: agent-candidate-${{ github.event.issue.number || inputs.issue_number }}
          path: ${{ runner.temp }}/agent-candidate
      - name: Validate patch policy and run tests without publication credentials
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/agent-candidate/agent.patch"
          test -s "$patch"
          # Policy and CI runner come from the trusted event base, not the patch.
          git show HEAD:scripts/agent_patch_policy.py > "$RUNNER_TEMP/trusted-policy.py"
          git apply --check "$patch"
          git apply "$patch"
          python3 -B "$RUNNER_TEMP/trusted-policy.py" --output "$RUNNER_TEMP/checked.patch"
          cmp "$patch" "$RUNNER_TEMP/checked.patch"
          python3 -B scripts/ci_quality.py --output "$RUNNER_TEMP/verify-proof"
      - name: Seal verified artifact for clean publisher
        id: seal
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/agent-verified"
          cp "$RUNNER_TEMP/checked.patch" "$RUNNER_TEMP/agent-verified/verified.patch"
          (cd "$RUNNER_TEMP/agent-verified" && sha256sum verified.patch > verified.patch.sha256)
          printf 'patch_sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/checked.patch" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish only verification result (not executable workspace)
        uses: actions/upload-artifact@v4
        with:
          name: agent-verified-${{ github.event.issue.number || inputs.issue_number }}
          path: ${{ runner.temp }}/agent-verified/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve unprivileged test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-verify-evidence-${{ github.event.issue.number || inputs.issue_number }}
          path: ${{ runner.temp }}/verify-proof/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # New, clean hosted runner. Do not run tests, pip/npm, or project scripts here.
    # Only a validated patch is applied as inert data before minting App credentials.
    needs: [verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {}
    steps:
      - name: Checkout exact trusted base with no persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - name: Download promoted verified patch only
        uses: actions/download-artifact@v4
        with:
          name: agent-verified-${{ github.event.issue.number || inputs.issue_number }}
          path: ${{ runner.temp }}/agent-verified
      - name: Verify provenance, digest and applicability; never execute patch files
        env:
          EXPECTED_SHA256: ${{ needs.verify.outputs.patch_sha256 }}
          VERIFIED_BASE_SHA: ${{ needs.verify.outputs.base_sha }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_SHA256"
          test "$(git rev-parse HEAD)" = "$VERIFIED_BASE_SHA"
          cd "$RUNNER_TEMP/agent-verified"
          sha256sum -c verified.patch.sha256
          test "$(sha256sum verified.patch | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          cd "$GITHUB_WORKSPACE"
          git config --local core.hooksPath /dev/null
          git apply --check "$RUNNER_TEMP/agent-verified/verified.patch"
          git apply "$RUNNER_TEMP/agent-verified/verified.patch"
          # No source code from the patch is executed in this job.
      - name: Require GitHub App credentials for CI-triggering PRs
        env:
          APP_ID: ${{ vars.AGENT_APP_ID }}
          APP_KEY: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
        run: |
          if test -z "$APP_ID" || test -z "$APP_KEY"; then
            echo 'Configure AGENT_APP_ID and AGENT_APP_PRIVATE_KEY before enabling automatic PR publication.' >&2
            exit 1
          fi
      - name: Mint short-lived publisher token
        id: publisher
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open/update bounded agent PR (never merge)
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.publisher.outputs.token }}
          base: master
          commit-message: 'feat(agent): implement issue #${{ github.event.issue.number || inputs.issue_number }}'
          branch: agent/issue-${{ github.event.issue.number || inputs.issue_number }}
          delete-branch: false
          title: 'feat(agent): implement issue #${{ github.event.issue.number || inputs.issue_number }}'
          body: |
            Implements #${{ github.event.issue.number || inputs.issue_number }}.

            ## Problem and acceptance criteria
            See the approved linked issue for acceptance criteria.

            ## User impact and risks
            Generated by a constrained agent; review all behavior and rollback impact before merging.

            ## Evidence
            - Independent isolated validation and patch digest: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (attempt ${{ github.run_attempt }}).
            - Independent PR `quality-gate`: pending until it executes on this commit.
            - Live desktop behavior, visual changes, and `chezmoi apply`: **not tested**.
          draft: true
