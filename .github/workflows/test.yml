name: test event

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ready' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pull request event safely
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_LABEL: ${{ github.event.label.name || '' }}
        run: |
          printf 'action=%s\n' "$PR_ACTION"
          printf 'label=%s\n' "$PR_LABEL"

  final:
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Inspect pull request event safely
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_LABEL: ${{ github.event.label.name || '' }}
        run: |
          printf 'action=%s\n' "$PR_ACTION"
          printf 'label=%s\n' "$PR_LABEL"
