name: PR Quality Evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    name: offline-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Bootstrap checksum-pinned ImageMagick
        env:
          MAGICK_VERSION: 7.1.2-33
          MAGICK_URL: https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-33/ImageMagick-7.1.2-33-gcc-x86_64.AppImage
          MAGICK_SHA256: af598b07ab4dd8b8123623602dc9fc69d5e32185a36fd3739795a0deb02c1fb7
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/ImageMagick-${MAGICK_VERSION}-gcc-x86_64.AppImage"
          install_root="$RUNNER_TEMP/sddm-imagemagick"
          tool_bin="$RUNNER_TEMP/sddm-imagemagick-bin"
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 10 --max-time 180 "$MAGICK_URL" -o "$asset"
          printf '%s  %s\n' "$MAGICK_SHA256" "$asset" | sha256sum --check --status
          chmod 700 "$asset"
          mkdir -m 700 "$install_root" "$tool_bin"
          (
            cd "$install_root"
            "$asset" --appimage-extract
          )
          test -x "$install_root/squashfs-root/AppRun"
          ln -s "$install_root/squashfs-root/AppRun" "$tool_bin/magick"
          echo "$tool_bin" >> "$GITHUB_PATH"
          export PATH="$tool_bin:$PATH"
          test "$(command -v magick)" = "$tool_bin/magick"
          magick -version | grep -F "ImageMagick $MAGICK_VERSION "
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Install checksum-verified chezmoi for offline checks
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/chezmoi-bin"
          archive="$RUNNER_TEMP/chezmoi_2.73.0_linux_amd64.tar.gz"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            https://github.com/twpayne/chezmoi/releases/download/v2.73.0/chezmoi_2.73.0_linux_amd64.tar.gz \
            -o "$archive"
          echo "b597729b687af4488a848240134cb633de8ca0f04e0d26d48f400ee2ac338ffa  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$tool_dir" chezmoi
          echo "$tool_dir" >> "$GITHUB_PATH"
          "$tool_dir/chezmoi" --version | grep -Fq 'v2.73.0'
      - name: Execute offline checks and write a receipt
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci_quality.py
      - name: Upload machine-readable logs and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-evidence/
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish summary
        if: always()
        run: |
          if test -f .ci-evidence/report.md; then
            cat .ci-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Quality evidence generation failed.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  workflow-sanity:
    name: workflow-sanity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run checksum-verified actionlint on every workflow
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # The generated github-next .lock.yml contains queue metadata not supported by actionlint v1.7.12.
          # Lint every authored .yml/.yaml; the generated lock is validated by its own producer.
          find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) ! -name '*.lock.yml' -print0 |
            xargs -0 "$RUNNER_TEMP/actionlint"

  quality-gate:
    name: quality-gate
    if: always()
    needs: [offline-validation, workflow-sanity]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Reject failed, skipped or canceled validation
        env:
          TEST_RESULT: ${{ needs.offline-validation.result }}
          LINT_RESULT: ${{ needs.workflow-sanity.result }}
        run: |
          test "$TEST_RESULT" = success && test "$LINT_RESULT" = success
