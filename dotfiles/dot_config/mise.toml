[tools]
python = "3.13"
node   = "24"
go     = "latest"
rust   = "latest"
"npm:vibe-kanban" = "latest"
codex = "latest"
opencode = "latest"
starship = "latest"
claude = "latest"
pi = "latest"
gemini-cli = "latest"
k9s = "latest"
uv = "latest"
"npm:@bitwarden/cli" = "latest"
"npm:skills" = "latest"
"npm:@termly-dev/cli" = "latest"
bun = "latest"
"cargo:alacritty" = "latest"
github-cli = "latest"
ripgrep = "latest"
rtk = "latest"


[settings]
activate_aggressive = true # append this tools into PATH automatic
auto_install = true
python.uv_venv_auto = "create|source"

[env]
# disable tool chain auto download
GOTOOLCHAIN = "local"
RUSTUP_DIST_SERVER="https://rsproxy.cn"
RUSTUP_UPDATE_ROOT="https://rsproxy.cn/rustup"
UV_INDEX="https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tasks.bootstrap]
description = "初始化环境：确保先安装基础语言，再安装衍生工具"
run = [
    "mise install -y go rust node python bun",
    "mise install -y"
]

[tasks.claude]
description = "Inject Bitwarden secret and launch claude code"
# 1. 检查 Bitwarden 是否解锁
# 2. 获取密码并赋值给 OC_GITHUB_PAT
# 3. 启动 VS Code (code .)，该进程将继承这个变量
run = """
#!/usr/bin/env bash
set -e  # 遇到错误立即停止

# 1. 检查状态。如果没有解锁，则执行解锁并捕获 Session Key
if ! bw status | grep -q "unlocked"; then
    echo "🔐 Bitwarden is locked. Prompting for unlock..."
    
    # 关键修改：使用 --raw 只获取 Key 字符串，并直接 export 到环境变量
    export BW_SESSION=$(bw unlock --raw)
    
    echo "✅ Vault unlocked locally for this task."
fi

export ANTHROPIC_BASE_URL=http://127.0.0.1:4000
export ANTHROPIC_AUTH_TOKEN=$(bw get password litellm)
export ANTHROPIC_MODEL=gemini/gemini-3.1-pro-preview
echo "Fetching GitHub PAT..."
export CONTEXT7_KEY=$(bw get password context7)

cd "${MISE_ORIGINAL_CWD:-.}"
claude --dangerously-skip-permissions
"""
[tasks.ocacp]
description = "Inject Bitwarden secret and launch opencode"
# 1. 检查 Bitwarden 是否解锁
# 2. 获取密码并赋值给 OC_GITHUB_PAT
# 3. 启动 VS Code (code .)，该进程将继承这个变量
run = """
#!/usr/bin/env bash
set -e  # 遇到错误立即停止

# 1. 检查状态。如果没有解锁，则执行解锁并捕获 Session Key
if ! bw status | grep -q "unlocked"; then
    echo "🔐 Bitwarden is locked. Prompting for unlock..."
    
    # 关键修改：使用 --raw 只获取 Key 字符串，并直接 export 到环境变量
    export BW_SESSION=$(bw unlock --raw)
    
    echo "✅ Vault unlocked locally for this task."
fi

echo "Fetching Context7 API KEY..."
export CONTEXT7_KEY=$(bw get password context7)
echo "Fetching Litellm API KEY..."
export OC_LITELLM_KEY=$(bw get password litellm)
export RTK_TELEMETRY_DISABLED=1
npx @rebornix/stdio-to-ws "opencode acp ${MISE_ORIGINAL_CWD}" --port 3000 --persist --grace-period -1
"""

[tasks.oc]
description = "Inject Bitwarden secret and launch opencode"
# 1. 检查 Bitwarden 是否解锁
# 2. 获取密码并赋值给 OC_GITHUB_PAT
# 3. 启动 VS Code (code .)，该进程将继承这个变量
run = """
#!/usr/bin/env bash
set -e  # 遇到错误立即停止

# 1. 检查状态。如果没有解锁，则执行解锁并捕获 Session Key
if ! bw status | grep -q "unlocked"; then
    echo "🔐 Bitwarden is locked. Prompting for unlock..."
    
    # 关键修改：使用 --raw 只获取 Key 字符串，并直接 export 到环境变量
    export BW_SESSION=$(bw unlock --raw)
    
    echo "✅ Vault unlocked locally for this task."
fi

# 2. 获取 Github PAT
# 这里的 --session "$BW_SESSION" 显式传递 Key，确保万无一失
echo "Fetching Context7 API KEY..."
export CONTEXT7_KEY=$(bw get password context7)
export RTK_TELEMETRY_DISABLED=1
export OMO_DISABLE_POSTHOG=1
opencode "${MISE_ORIGINAL_CWD:-.}"
"""
